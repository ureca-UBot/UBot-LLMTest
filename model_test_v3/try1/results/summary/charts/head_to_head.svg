<text x="26.0" y="32.0" class="ttl" font-size="19" text-anchor="start">유형별 정답률 맞대결 — qwen3:14b OFF vs gemma3:12b</text>
<text x="26.0" y="54.0" class="sub" font-size="12.5" text-anchor="start">대각선 위 = 왼쪽 모델 우세. 원 크기는 문항 수. LLM Judge 전수 채점 결과다.</text>

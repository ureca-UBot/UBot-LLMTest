<text x="26.0" y="722.0" class="lbl" font-size="12.5" text-anchor="start" font-weight="700">정답률 50% 미만 유형: gemma3:12b 5개 · qwen3:14b OFF 2개</text>
<text x="26.0" y="742.0" class="note" font-size="11.5" text-anchor="start">전체 평균만 보면 가려지는 구멍이 여기서 드러난다. 상담봇은 평균이 아니라 최저치가 품질을 정한다.</text>
<text x="26.0" y="762.0" class="note" font-size="11" text-anchor="start">문항 수가 작은 유형(API 5건 등)은 원이 작다 — 한 문항이 20%p라 확정적으로 읽지 않는다.</text>

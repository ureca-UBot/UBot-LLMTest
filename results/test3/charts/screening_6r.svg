<g class="viz"><rect class="bg" x="0" y="0" width="940" height="500"/>
<text x="26.0" y="32.0" class="ttl" font-size="19" text-anchor="start">1차 선별 — 하자 있는 모델 걸러내기 (6라운드)</text>
<text x="26.0" y="54.0" class="sub" font-size="12.5" text-anchor="start">지표 6개를 한 번씩, 매 라운드 최하위 1개 탈락. 11개 → 5개 생존.</text>
<text x="26.0" y="74.0" class="sub" font-size="12.5" text-anchor="start" font-weight="600">5개 설정은 어떤 순서에서도 탈락했다. 반대로 상위 4개는 서로 큰 차이가 없다.</text>

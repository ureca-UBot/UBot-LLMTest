<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486"
 role="img" aria-label="v0 대비 프롬프트별 얻은 문항과 잃은 문항" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7;
         --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835;
           --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  .bg   { fill: var(--surface); }
  .ttl  { fill: var(--ink);   font-weight:700; }
  .sub  { fill: var(--ink2); }
  .lbl  { fill: var(--ink);  }
  .axl  { fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width:1; }
  .axis { stroke: var(--axis); stroke-width:1; }
  .note { fill: var(--ink2); }
  .pt   { cursor: default; }
  .pt:hover circle { stroke: var(--ink); stroke-width: 2.5; }
</style>
<g class="viz"><rect class="bg" x="0" y="0" width="960" height="486"/>
<text x="26.0" y="32.0" class="ttl" font-size="19" text-anchor="start">v0 대비 어디서 얻고 어디서 잃었나</text>
<text x="26.0" y="54.0" class="sub" font-size="12.5" text-anchor="start">같은 문항끼리 짝지어 센 LLM Judge 정답 수. 오른쪽 = v0에서 틀렸다가 맞힌 문항, 왼쪽 = v0에서 맞혔다가 틀린 문항.</text>
<text x="26.0" y="74.0" class="sub" font-size="12.5" text-anchor="start" font-weight="600">세 안 모두 "막아야 할 문항"은 크게 고쳤다. "답해야 할 문항"을 유의하게 잃지 않은 건 v2뿐이다.</text>
<text x="492.0" y="112.0" class="sub" font-size="12" text-anchor="end" font-weight="600">← 잃음 (v0만 맞힘)</text>
<text x="508.0" y="112.0" class="sub" font-size="12" text-anchor="start" font-weight="600">얻음 (이 안만 맞힘) →</text>
<text x="934.0" y="112.0" class="sub" font-size="12" text-anchor="end" font-weight="600">순증 · McNemar</text>
<text x="26.0" y="164.0" class="lbl" font-size="14" text-anchor="start" font-weight="700" style="fill:var(--s1)">v1 상태 규칙</text>
<text x="250.0" y="146.0" class="note" font-size="12" text-anchor="end">막아야 할 문항 (n=104)</text>
<rect x="493.8" y="132" width="6.2" height="20" rx="3" fill="var(--s2)" fill-opacity="0.55"/>
<rect x="500" y="132" width="230.0" height="20" rx="3" fill="var(--s3)" fill-opacity="1"/>
<text x="487.8" y="147.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">−1</text>
<text x="736.0" y="147.0" class="lbl" font-size="12" text-anchor="start">+37</text>
<text x="934.0" y="147.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">+36  p&lt;0.001  유의하게 좋아짐</text>
<text x="250.0" y="180.0" class="note" font-size="12" text-anchor="end">답해야 할 문항 (n=196)</text>
<rect x="381.9" y="166" width="118.1" height="20" rx="3" fill="var(--s2)" fill-opacity="1"/>
<rect x="500" y="166" width="43.5" height="20" rx="3" fill="var(--s3)" fill-opacity="0.55"/>
<text x="375.9" y="181.0" class="lbl" font-size="12" text-anchor="end" font-weight="700">−19</text>
<text x="549.5" y="181.0" class="lbl" font-size="12" text-anchor="start">+7</text>
<text x="934.0" y="181.0" class="lbl" font-size="12" text-anchor="end" font-weight="700" style="fill:var(--s2)">−12  p=0.03  유의하게 나빠짐</text>
<line class="grid" x1="26" y1="203.0" x2="934" y2="203.0"/>
<text x="26.0" y="254.0" class="lbl" font-size="14" text-anchor="start" font-weight="700" style="fill:var(--s3)">v2 값 가드</text>
<text x="250.0" y="236.0" class="note" font-size="12" text-anchor="end">막아야 할 문항 (n=104)</text>
<rect x="487.6" y="222" width="12.4" height="20" rx="3" fill="var(--s2)" fill-opacity="0.55"/>
<rect x="500" y="222" width="198.9" height="20" rx="3" fill="var(--s3)" fill-opacity="1"/>
<text x="481.6" y="237.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">−2</text>
<text x="704.9" y="237.0" class="lbl" font-size="12" text-anchor="start">+32</text>
<text x="934.0" y="237.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">+30  p&lt;0.001  유의하게 좋아짐</text>
<text x="250.0" y="270.0" class="note" font-size="12" text-anchor="end">답해야 할 문항 (n=196)</text>
<rect x="444.1" y="256" width="55.9" height="20" rx="3" fill="var(--s2)" fill-opacity="0.55"/>
<rect x="500" y="256" width="37.3" height="20" rx="3" fill="var(--s3)" fill-opacity="0.55"/>
<text x="438.1" y="271.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">−9</text>
<text x="543.3" y="271.0" class="lbl" font-size="12" text-anchor="start">+6</text>
<text x="934.0" y="271.0" class="note" font-size="12" text-anchor="end" font-weight="400">−3  p=0.61  차이 없음</text>
<line class="grid" x1="26" y1="293.0" x2="934" y2="293.0"/>
<text x="26.0" y="344.0" class="lbl" font-size="14" text-anchor="start" font-weight="700" style="fill:var(--s4)">v3 판단 순서</text>
<text x="250.0" y="326.0" class="note" font-size="12" text-anchor="end">막아야 할 문항 (n=104)</text>
<rect x="481.4" y="312" width="18.6" height="20" rx="3" fill="var(--s2)" fill-opacity="0.55"/>
<rect x="500" y="312" width="211.4" height="20" rx="3" fill="var(--s3)" fill-opacity="1"/>
<text x="475.4" y="327.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">−3</text>
<text x="717.4" y="327.0" class="lbl" font-size="12" text-anchor="start">+34</text>
<text x="934.0" y="327.0" class="lbl" font-size="12" text-anchor="end" font-weight="400">+31  p&lt;0.001  유의하게 좋아짐</text>
<text x="250.0" y="360.0" class="note" font-size="12" text-anchor="end">답해야 할 문항 (n=196)</text>
<rect x="344.6" y="346" width="155.4" height="20" rx="3" fill="var(--s2)" fill-opacity="1"/>
<rect x="500" y="346" width="31.1" height="20" rx="3" fill="var(--s3)" fill-opacity="0.55"/>
<text x="338.6" y="361.0" class="lbl" font-size="12" text-anchor="end" font-weight="700">−25</text>
<text x="537.1" y="361.0" class="lbl" font-size="12" text-anchor="start">+5</text>
<text x="934.0" y="361.0" class="lbl" font-size="12" text-anchor="end" font-weight="700" style="fill:var(--s2)">−20  p&lt;0.001  유의하게 나빠짐</text>
<line class="axis" x1="500" y1="124" x2="500" y2="378"/>
<text x="26.0" y="438.0" class="note" font-size="11.5" text-anchor="start">막아야 할 문항: 기대 상태가 보류·확인 요청·범위 밖·충돌 고지. 답해야 할 문항: 기대 상태가 답변·부분 답변.</text>
<text x="26.0" y="456.0" class="note" font-size="11.5" text-anchor="start">McNemar 정확검정(양측)은 짝이 갈린 문항만으로 우연 여부를 본다. p&lt;0.05면 진하게 표시했다.</text>
<text x="26.0" y="474.0" class="note" font-size="11.5" text-anchor="start">qwen3:14b · temperature 0 · 추론 끔 · 300문항</text>
</g></svg>

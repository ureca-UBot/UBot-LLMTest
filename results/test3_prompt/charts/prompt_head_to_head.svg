<text x="26.0" y="54.0" class="sub" font-size="12.5" text-anchor="start">대각선 위 = v2 우세. 원 크기는 문항 수, 빈 원은 10문항 미만. LLM Judge 정답률.</text>
<text x="26.0" y="74.0" class="sub" font-size="12.5" text-anchor="start">점에 마우스를 올리면 유형 이름과 안별 정답률이 보인다.</text>
<text x="26.0" y="96.0" class="sub" font-size="13" text-anchor="start" font-weight="700">v2 5승 · v0 4승 · 무 4</text>

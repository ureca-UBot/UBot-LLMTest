<text x="26.0" y="722.0" class="note" font-size="11.5" text-anchor="start">초록 = v2가 높음, 주황 = v0가 높음, 회색 = 같음. 진한 원 = 10%p 이상 차이.</text>
<text x="26.0" y="740.0" class="note" font-size="11.5" text-anchor="start">축은 20%부터. 겹치는 원은 옆으로 밀고 실제 위치는 작은 점과 가는 선으로 남겼다.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660"
 role="img" aria-label="프롬프트별 답해야 할 문항과 막아야 할 문항 정답률" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7;
         --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835;
           --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  .bg   { fill: var(--surface); }
  .ttl  { fill: var(--ink);   font-weight:700; }
  .sub  { fill: var(--ink2); }
  .lbl  { fill: var(--ink);  }
  .axl  { fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width:1; }
  .axis { stroke: var(--axis); stroke-width:1; }
  .note { fill: var(--ink2); }
  .pt   { cursor: default; }
  .pt:hover circle { stroke: var(--ink); stroke-width: 2.5; }
</style>
<g class="viz"><rect class="bg" x="0" y="0" width="960" height="660"/>
<text x="26.0" y="32.0" class="ttl" font-size="19" text-anchor="start">보류를 늘리면서 답변 능력을 지킨 건 v2뿐</text>
<text x="26.0" y="54.0" class="sub" font-size="12.5" text-anchor="start">x = 답해야 할 문항(기대 상태 답변·부분 답변) 정답률 · y = 막아야 할 문항(보류·확인·범위 밖·충돌) 정답률.</text>
<text x="26.0" y="74.0" class="sub" font-size="12.5" text-anchor="start">오른쪽 위일수록 좋다. 가로·세로 선은 95% 신뢰구간(Wilson), 점선 화살표는 v0에서의 이동.</text>

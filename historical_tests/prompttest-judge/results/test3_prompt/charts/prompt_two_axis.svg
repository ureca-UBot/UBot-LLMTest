<text x="26.0" y="630.0" class="note" font-size="11.5" text-anchor="start">LLM Judge(gpt-6-astra) 정답 판정 기준. v0는 medium, v1~v3는 ultra 설정으로 채점했다 — v0와 답이 글자까지 같은 69~91문항에서 두 설정의 판정은 100% 일치했다.</text>
